[build-system]
requires = [
    "setuptools>=46",
    "wheel",
    "numpy",
    "setuptools_scm>=7",
    "tomli>=1.0.0; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[project]
name = "numparquet"
authors = [
    {name = "Eli Rykoff", email = "erykoff@stanford.edu"},
]
description = "Direct reading of parquet files with numpy"
dynamic = ["version", "dependencies"]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">= 3.9"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]

[project.urls]
home = "https://github.com/erykoff/numparquet"

[project.optional-dependencies]
test = ["pytest", "pyarrow", "flake8", "fsspec"]

[tool.setuptools]
include-package-data = true
zip-safe = true
packages = {find = {exclude=["tests*"]}}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
numparquet = ["data/parquet.thrift"]

[tool.setuptools_scm]
write_to = "numparquet/_version.py"
write_to_template = "__version__ = '{version}'\n"

[tool.flake8]
max-line-length = 110
ignore = ["E133", "E226", "E228", "N802", "N803", "N806", "N812", "N815", "N816", "W503"]
exclude = [
  "**/__init__.py",
  "docs/conf.py",
  "docs/_build/html/conf.py",
  "build",
]
